[project]
name = "latticelife"
version = "0.1.0"
description = "LatticeLife — a lattice cellular automaton research platform. Geometry is data; one update rule."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pygame>=2.5",
]

[project.optional-dependencies]
torus = [
    "moderngl>=5.10",
    "pyrr>=0.10.3",
]

[project.scripts]
latticelife = "latticelife.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/latticelife"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
